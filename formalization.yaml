status:
  scope: 'Eleven selected statements: five preserved adjacency-spectrum bounds on finite nonempty simple graphs
    and six new finite graph Cheeger/Poincare/cut/Laplacian statements. The main discrete Cheeger theorem assumes
    n >= 2 only, and includes disconnected and edgeless graphs. The gap is explicitly the Rayleigh infimum
    over mean-zero nonzero functions; not a sorted-eigenvalue-index definition. Six independent explicit definitions
    are compared. Eleven intentional placeholders occur only in the independent Challenge.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
