  methods:
  - method: autonomous
    models:
    - Aristotle (Harmonic)
    framework: Aristotle CLI
    tool_setup: Produced all proofs in one run from the formal statements and a proof plan (Rayleigh quotient
      bounds from the spectral theorem, greedy colouring, test vectors on colour classes and independent sets);
      the return was audited (statements and headers unchanged, no added axioms) and rebuilt locally.
    cost:
      wall_time: under one hour
      spend_usd: not tracked
      hardware: API-only
    prompting_notes: Formal statements and proof plan supplied.
  - method: agent
    models:
    - Claude Opus 5.5
    framework: Claude Code (Anthropic)
    tool_setup: Statement design, proof plan, integration and review of the Aristotle return, and the Palomar
      packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
    cost:
      wall_time: about one hour
      spend_usd: subscription-based
      hardware: local machine
    prompting_notes: Natural-language instructions in Spanish, directed by the author.
  - method: agent
    models:
    - OpenAI Codex
    framework: Codex
    tool_setup: 'New extension: extracted finite median code from Lean Pool; adapted the support-peeling coarea
      induction from permutation variation to symmetric graph arcs; constructed Cauchy–Schwarz/degree estimates,
      mean-zero Poincare inequality, Rayleigh-infimum arguments and Laplacian bridges. Preserved the old proof
      bodies and narrowed their Mathlib imports. Used strict Lean builds, explicit boundary/axiom audits, independent
      Comparator with Lean and NanoDa. No sub-agents or external proving service were used for the extension.'
    prompting_notes: Human-directed continuation of the effort/reuse-prioritized backlog, preserving the existing
      registered results and using the GitHub plugin for publication. New extension costs and wall time were
      not tracked.
  spend_usd: subscription-based
  notes: The results were chosen by the human author; the Lean proofs are AI-generated and mechanically verified
    (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical elaborated types for
    the Challenge/Solution pair).
fidelity:
  divergences: The five original registered contracts are unchanged. New GraphCheeger definitions use finite
    oriented arcs, boundary arcs directed from a set to its complement (one per crossing edge), unnormalized
    Dirichlet energy (oriented square sum divided by two), and actual finite maximum degree. The graph gap
    is the infimum of E(f)/sum(f^2) over nonzero mean-zero real functions. Under n >= 2 both variational sets
    are proved nonempty and bounded below. The pair of Cheeger inequalities and Poincare estimate have no regularity,
    connectivity, positive-degree, or positive-gap premise. A separate zero-degree argument is proved. The
    complementary-set spectral cut bound corresponds to the distance-one complementary case of Alon–Milman
    Lemma 2.1. Energy is proved equal to the quadratic form of Mathlib SimpleGraph.lapMatrix, and the gap is
    characterized as the greatest Poincare constant; nonzero Laplacian eigenvalues are bounded below by it.
    Equality with a specific sorted Matrix.IsHermitian.eigenvalues_0 index is not proved here. The manifold
    Cheeger theorem, infinite-graph transience, expander constructions, concentration and diameter bounds,
    and superconcentrators are outside scope.
review:
  status: self-assessed
  reviewers:
  - Claude Opus 5.5 (AI agent in Claude Code, acting for the author)
  notes: 'The old five-result package retains its registered proof bodies, statements and recorded provenance.
    The new extension is self-assessed: checked the primary Alon–Milman Laplacian/Rayleigh normalization and
    complementary-set cut estimate. Six graph definitions are repeated fully in the independent Challenge.
    The audit checks eleven axiom sets, exact K2 energy, h = 1 and lambda = 2, tightness of lambda/2 <= h,
    and h = lambda = 0 for an edgeless three-vertex graph. No solution placeholders, custom axioms, independent
    human review, or mathematical novelty is claimed. Local/remote preflight evidence does not itself submit
    or register an entry.'
