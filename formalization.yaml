version: v0.4
project:
  name: Spectral graph bounds and discrete Cheeger inequalities
  description: Extends the five registered adjacency-spectrum bounds with discrete Cheeger inequalities lambda/2
    <= h and h^2 <= 2 Delta lambda for the unnormalized graph Laplacian in Rayleigh variational form. Includes
    the universal Poincare estimate, greatest-constant characterization, complementary spectral cut bound,
    actual Laplacian energy identity, and comparison with nonzero Laplacian eigenvalues.
  authors:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
classification:
  arxiv:
  - math.CO
  msc2020:
  - 05C50
  - 05C40
  - 05C15
  - 05C69
